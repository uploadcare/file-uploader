<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>v2 Spike — Regular</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #111;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .desc {
        color: #475569;
        margin-bottom: 2rem;
      }
      section {
        margin: 2rem 0;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
      }
      h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        color: #334155;
      }
      pre {
        background: #f8fafc;
        padding: 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.85rem;
        overflow-x: auto;
        white-space: pre-wrap;
      }
    </style>
    <script type="module" src="../../src/index.ts"></script>
  </head>
  <body>
    <h1>v2 spike — regular preset</h1>
    <p class="desc">
      v2 architecture (controllers + plugin API + ctx-name registry) on top of v1's
      UI elements. Visual fidelity matches v1.
    </p>

    <section>
      <h2>1. Preset (default tree) + v2 plugins</h2>
      <uc-uploader-regular
        id="u1"
        ctx-name="demo-1"
        pubkey="demopublickey"
      ></uc-uploader-regular>
    </section>

    <script type="module">
      import {
        urlSourcePlugin,
        cameraPlugin,
        externalSourcesPlugin,
        imageShrinkPlugin,
        localSourcePlugin,
      } from '../../src/index.ts';

      const u = document.getElementById('u1');
      u.plugins = [
        localSourcePlugin,
        urlSourcePlugin,
        cameraPlugin,
        externalSourcesPlugin,
        imageShrinkPlugin,
      ];
      window.u = u;
    </script>
  </body>
</html>
