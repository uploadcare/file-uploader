<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>v2 Spike — Minimal</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      pre { background: #f8fafc; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.85rem; white-space: pre-wrap; }
    </style>
    <script type="module" src="../../src/index.ts"></script>
  </head>
  <body>
    <h1>v2 spike — minimal preset</h1>
    <p>Persistent inline trigger; clicking opens a modal source-picker. Files added land in the inline upload-list.</p>
    <uc-uploader-minimal id="u" ctx-name="minimal-demo" pubkey="demopublickey"></uc-uploader-minimal>

    <script type="module">
      import {
        urlSourcePlugin,
        cameraPlugin,
        externalSourcesPlugin,
        imageShrinkPlugin,
        localSourcePlugin,
      } from '../../src/index.ts';

      const u = document.getElementById('u');
      u.plugins = [
        localSourcePlugin,
        urlSourcePlugin,
        cameraPlugin,
        externalSourcesPlugin,
        imageShrinkPlugin,
      ];
      window.u = u;
    </script>
  </body>
</html>
