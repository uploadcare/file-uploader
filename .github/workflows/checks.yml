name: checks

on:
  pull_request:
  # Runs the whole e2e suite against the real API on demand (Actions > checks >
  # Run workflow), e.g. on master between releases, to find API drift before a
  # release branch does.
  workflow_dispatch:

# The checks only read the repo; keep the GITHUB_TOKEN least-privilege
# (the repo default is write-all).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: npm run build
      # test:types (vitest typecheck of types/test against dist/index.d.ts) and tsc (tsconfig.test
      # references the generated types/jsx.d.ts) both need the build output, so they run here.
      - name: Validate type definitions
        run: npm run test:types
      - name: Typecheck
        run: npm run tsc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    env:
      # e2e talks to the emulator in @uploadcare/api-emulator by default, so a
      # normal PR needs neither API access nor luck with timing. Release
      # branches run against the real service instead — a fake cannot tell
      # you the upload API changed under you — and any PR can opt in by
      # carrying the `e2e-live` label, as does a manual run.
      E2E_NET: >-
        ${{ (github.event_name == 'workflow_dispatch'
          || startsWith(github.head_ref, 'releases/v')
          || contains(github.event.pull_request.labels.*.name, 'e2e-live'))
          && 'live' || 'fake' }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # System packages aren't covered by the browser cache, so install them
      # unconditionally; only the browser binaries below are cache-gated.
      - name: Install playwright system deps
        timeout-minutes: 10
        env:
          # `playwright install-deps` shells out to apt-get; keep it from
          # stalling for hours on an interactive prompt (e.g. Ubuntu's needrestart).
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install-deps chromium
      - uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium
      # specs/npm imports the published package (dist/ + web/), so tests need
      # the build output too.
      - name: Build
        run: npm run build
      # `test:coverage` runs both vitest projects in one pass, so coverage is
      # merged across specs and e2e instead of each run overwriting the other.
      # Without the Signed Uploads secrets: a fake run never reads them, and a
      # live one skips the auth token tests, which the next step runs.
      - name: Run tests
        run: npm run test:coverage && npm run test:locales
      # The emulator only knows the token rules it was written with, so the auth
      # token tests also run against the real API on every PR, on purpose: only
      # it can say Upload API still accepts the tokens the uploader sends.
      # The only step that sees the secrets of that project, a real one with
      # Signed Uploads enabled. E2E_REQUIRE_SECURE_UPLOADS turns missing or
      # rotated secrets (or a fork PR, which gets none) into a failed step
      # instead of a green one where every test skipped.
      - name: Run auth token tests against the real API
        env:
          E2E_REQUIRE_SECURE_UPLOADS: '1'
          UPLOAD_CLIENT_SECURE_UPLOADS_PUBLIC_KEY: ${{ secrets.UPLOAD_CLIENT_SECURE_UPLOADS_PUBLIC_KEY }}
          UPLOAD_CLIENT_SECURE_UPLOADS_SECRET_KEY: ${{ secrets.UPLOAD_CLIENT_SECURE_UPLOADS_SECRET_KEY }}
        run: E2E_NET=live npx vitest run --project e2e tests/uploading/auth-token.e2e.test.tsx
      - name: Archive artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: e2e-tests
          path: |
            tests/__screenshots__/**
            tests/__coverage__/**
